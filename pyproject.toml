[project]
name = "research-scout"
version = "0.1.0"
description = "Research Scout: a bounded PydanticAI agent that finds papers matching year and citation constraints."
readme = "README.md"
requires-python = ">=3.11"
# Direct dependencies only. requirements.txt keeps the full pinned set (used by the Dockerfile).
dependencies = [
    "pydantic==2.14.1",
    "pydantic-ai-slim[openai]==2.61.0",
    "openai==3.39.0",
    "httpx2==2.16.0",
]

[project.scripts]
research-scout = "research.api.scout:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
